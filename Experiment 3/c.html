<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
    .external {
    color: green;
    font-size: 22px;
    background-color: lightgray;
    text-align: center;
}

        h2 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: red; text-align: center;">
        Inline CSS
    </h1>

    <h2>Internal CSS</h2>

    <p>
        This paragraph uses internal CSS.
    </p>

    <div class="external">
        This div uses external CSS.
    </div>

</body>
</html>
